<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Raptor's Call - Tactical Simulator</title>
    <style>
        /* ===== RESET ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0a0a12;
            color: #e0e0e0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ===== PHONE FRAME ===== */
        #phone {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 850px;
            background: #0a0e1c;
            border-radius: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #2a2a3a;
            position: relative;
        }

        /* ===== HEADER ===== */
        #header {
            padding: 12px 16px 6px 16px;
            background: #0d0d18;
            border-bottom: 1px solid #1f1f30;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            z-index: 60;
        }
        #header h1 {
            font-size: 16px;
            font-weight: 700;
            color: #f0b429;
            letter-spacing: 0.5px;
        }
        #header h1 small {
            font-size: 8px;
            color: #7a7a9a;
            font-weight: 400;
            display: block;
            margin-top: 0px;
            letter-spacing: 1px;
        }
        #sim-badge {
            background: #f0b429;
            color: #0a0a12;
            font-size: 8px;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 20px;
            text-transform: uppercase;
        }

        /* ===== SPLASH ===== */
        #splash-screen {
            position: absolute;
            inset: 0;
            z-index: 1000;
            background: rgba(14, 14, 14, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease;
            pointer-events: none;
        }
        #splash-screen.hidden { opacity: 0; pointer-events: none; }
        #splash-screen img {
            width: 65%;
            max-width: 240px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            margin-bottom: 20px;
        }
        #splash-screen .splash-title {
            font-size: 20px;
            font-weight: 800;
            color: #f0b429;
            letter-spacing: 4px;
        }
        #splash-screen .splash-sub {
            font-size: 10px;
            color: #64748b;
            letter-spacing: 5px;
            margin-top: 6px;
            text-transform: uppercase;
        }
        #splash-screen .splash-loader {
            margin-top: 20px;
            display: flex;
            gap: 6px;
        }
        #splash-screen .splash-loader span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #f0b429;
            animation: pulse-dot 1.2s ease-in-out infinite;
        }
        #splash-screen .splash-loader span:nth-child(2) { animation-delay: 0.2s; }
        #splash-screen .splash-loader span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes pulse-dot {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* ===== MAP AREA ===== */
        #map-container {
            flex: 1;
            position: relative;
            background: #0a0e1c;
            overflow: hidden;
            margin: 8px 10px 4px 10px;
            border-radius: 18px;
            border: 1px solid #1a1a2a;
            min-height: 200px;
        }
        #map-container canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
        }
        /* Rewind overlay sticker */
        #rewind-sticker {
            position: absolute;
            bottom: 12px;
            left: 12px;
            z-index: 20;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(8px);
            padding: 6px 12px;
            border-radius: 8px;
            border-left: 3px solid #f0b429;
            font-size: 10px;
            font-weight: 600;
            color: #f0b429;
            display: none;
            pointer-events: none;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }
        #rewind-sticker .time {
            color: #8a8aaa;
            font-weight: 400;
            font-size: 9px;
            margin-left: 8px;
        }

        /* ===== STATUS ===== */
        #status-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 15;
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(8px);
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 9px;
            border: 1px solid #2a2a3a;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #8a8aaa;
            flex-wrap: wrap;
        }
        #status-overlay .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #00d26a;
            display: inline-block;
            animation: blink 1.5s infinite;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
        #status-overlay span { color: #fff; font-weight: 600; margin-left: 2px; }

        /* ===== SCENARIO BUTTONS ===== */
        #scenario-bar {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 15;
            display: flex;
            gap: 4px;
        }
        #scenario-bar button {
            background: rgba(0,0,0,0.6);
            border: 1px solid #2a2a3a;
            color: #8a8aaa;
            font-size: 8px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.5px;
        }
        #scenario-bar button.active {
            background: rgba(240, 180, 41, 0.2);
            border-color: #f0b429;
            color: #f0b429;
        }
        #scenario-bar button:active { transform: scale(0.95); }

        /* ===== ALARM INDICATOR ===== */
        #alarm-indicator {
            position: absolute;
            top: 50px;
            right: 10px;
            z-index: 15;
            display: none;
            align-items: center;
            gap: 6px;
            background: rgba(255, 59, 74, 0.2);
            padding: 4px 10px 4px 6px;
            border-radius: 30px;
            border: 1px solid #ff3b4a;
            font-size: 9px;
            font-weight: 700;
            color: #ff3b4a;
            animation: flash-alarm 0.8s infinite;
        }
        #alarm-indicator.silent-mode {
            border-color: #f0b429;
            color: #f0b429;
            background: rgba(240, 180, 41, 0.15);
        }
        @keyframes flash-alarm {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        #alarm-indicator .pulse-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #ff3b4a;
            animation: pulse-threat 0.8s infinite;
        }
        #alarm-indicator.silent-mode .pulse-dot { background: #f0b429; }
        @keyframes pulse-threat {
            0% { transform: scale(1); }
            50% { transform: scale(1.8); }
            100% { transform: scale(1); }
        }

        /* ===== TOAST ===== */
        #alert-toast {
            position: absolute;
            top: 60px;
            left: 12px;
            right: 12px;
            z-index: 30;
            background: #ff3b4a;
            padding: 10px 14px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 11px;
            color: #fff;
            box-shadow: 0 10px 40px rgba(255, 59, 74, 0.4);
            display: none;
            text-align: center;
            border: 1px solid #ff6a76;
            animation: slideDown 0.3s ease;
        }
        #alert-toast.silent { background: #2a2a5a; border-color: #4a4a8a; box-shadow: 0 10px 40px rgba(42, 42, 90, 0.4); }
        #alert-toast .pin-prompt {
            margin-top: 6px;
            display: flex;
            gap: 6px;
            justify-content: center;
            align-items: center;
        }
        #alert-toast .pin-prompt input {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 6px;
            padding: 3px 10px;
            width: 70px;
            color: #fff;
            font-size: 14px;
            text-align: center;
            letter-spacing: 4px;
            outline: none;
        }
        #alert-toast .pin-prompt button {
            background: #fff;
            border: none;
            border-radius: 6px;
            padding: 3px 12px;
            font-weight: 700;
            font-size: 11px;
            color: #0a0a12;
            cursor: pointer;
        }
        @keyframes slideDown { 0% { transform: translateY(-20px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }

        /* ===== CHAT ===== */
        #chat-box {
            position: absolute;
            bottom: 120px;
            left: 8px;
            right: 8px;
            background: rgba(10, 10, 18, 0.96);
            border: 1px solid #2a2a3a;
            border-radius: 14px;
            padding: 10px;
            max-height: 140px;
            overflow-y: auto;
            z-index: 20;
            display: none;
            backdrop-filter: blur(20px);
        }
        #chat-box.active { display: block; }
        #chat-box .msg {
            padding: 3px 0;
            border-bottom: 1px solid #1a1a2a;
            font-size: 10px;
            display: flex;
            gap: 6px;
        }
        #chat-box .msg .sender { color: #f0b429; font-weight: 700; min-width: 45px; font-size: 9px; }
        #chat-box .msg .text { color: #d0d0e0; }
        #chat-box .msg .time { color: #5a5a7a; font-size: 7px; margin-left: auto; }
        #chat-input {
            width: 100%;
            background: #1a1a2e;
            border: none;
            border-radius: 30px;
            padding: 6px 12px;
            color: #fff;
            font-size: 11px;
            margin-top: 6px;
            outline: none;
        }
        #chat-input::placeholder { color: #5a5a7a; }

        /* ===== CONTROLS ===== */
        #controls {
            padding: 6px 10px 12px 10px;
            background: #0d0d18;
            border-top: 1px solid #1f1f30;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .ctrl-row {
            display: flex;
            gap: 6px;
            justify-content: center;
        }
        .ctrl-btn {
            background: #1a1a2e;
            border: 1px solid #2a2a3a;
            color: #c0c0d0;
            padding: 6px 8px;
            border-radius: 30px;
            font-size: 10px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            cursor: pointer;
            transition: all 0.15s;
            flex: 1;
            min-width: 36px;
            max-width: 100px;
            white-space: nowrap;
            user-select: none;
        }
        .ctrl-btn:active { transform: scale(0.94); }
        .ctrl-btn.primary { background: #f0b429; border-color: #f0b429; color: #0a0a12; }
        .ctrl-btn.danger { background: #ff3b4a; border-color: #ff3b4a; color: #fff; }
        .ctrl-btn.silent { background: #2a2a4a; border-color: #3a3a5a; color: #a0a0c0; }
        .ctrl-btn.overlay-btn {
            background: transparent;
            border-color: transparent;
            color: #6a6a8a;
            font-size: 9px;
            padding: 4px 6px;
            flex: 1;
            max-width: 80px;
        }
        .ctrl-btn.overlay-btn.active { color: #f0b429; background: rgba(240, 180, 41, 0.1); border-color: rgba(240, 180, 41, 0.2); }
        .ctrl-btn.overlay-btn.mesh-active { color: #00d26a; border-color: rgba(0, 210, 106, 0.3); background: rgba(0, 210, 106, 0.08); }
        .ctrl-btn.overlay-btn.radar-active { color: #22d3ee; border-color: rgba(34, 211, 238, 0.3); background: rgba(34, 211, 238, 0.08); }
        .ctrl-btn.overlay-btn.chat-active { color: #a78bfa; border-color: rgba(167, 139, 250, 0.3); background: rgba(167, 139, 250, 0.08); }
        .ctrl-btn .icon { font-size: 13px; }
        .ctrl-btn .badge { font-size: 7px; background: #ff3b4a; color: #fff; border-radius: 10px; padding: 1px 5px; margin-left: 2px; }
        #btnStopAlarm { display: none; background: #ff3b4a; border-color: #ff3b4a; color: #fff; animation: pulse-threat 0.8s infinite; flex: 1.5; }
        #btnStopAlarm.visible { display: flex; }
        /* Speed buttons inside controls */
        .speed-group {
            display: flex;
            gap: 4px;
            align-items: center;
            background: rgba(0,0,0,0.3);
            padding: 2px 6px;
            border-radius: 30px;
            flex: 1.5;
            max-width: 160px;
        }
        .speed-group .label { font-size: 7px; color: #5a5a7a; font-weight: 700; text-transform: uppercase; margin-right: 2px; }
        .speed-group button {
            background: transparent;
            border: none;
            color: #7a7a9a;
            font-size: 8px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .speed-group button.active { color: #f0b429; background: rgba(240, 180, 41, 0.15); }
        .speed-group button:active { transform: scale(0.9); }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 450px) {
            #phone { border-radius: 0; max-height: 100vh; border: none; }
            #header { padding: 10px 12px 4px 12px; }
            #header h1 { font-size: 14px; }
            #controls { padding: 4px 6px 10px 6px; gap: 4px; }
            .ctrl-btn { font-size: 8px; padding: 4px 5px; min-width: 30px; max-width: 80px; }
            .ctrl-btn.overlay-btn { font-size: 8px; padding: 3px 4px; max-width: 60px; }
            #status-overlay { font-size: 7px; padding: 3px 8px; top: 6px; left: 6px; }
            #scenario-bar { top: 6px; right: 6px; }
            #scenario-bar button { font-size: 7px; padding: 2px 6px; }
            #map-container { margin: 4px 6px 2px 6px; border-radius: 12px; }
            #chat-box { bottom: 100px; max-height: 100px; }
            .speed-group { max-width: 120px; }
            .speed-group button { font-size: 7px; padding: 1px 4px; }
        }
    </style>
</head>
<body>

<div id="phone">
    <!-- HEADER -->
    <div id="header">
        <h1>🦅 RAPTOR'S CALL <small>Tactical Simulator</small></h1>
        <div id="sim-badge">⚡ SIM</div>
    </div>

    <!-- SPLASH -->
    <div id="splash-screen">
        <img src="https://i.imgur.com/WKyKrQD.jpg" alt="Raptor's Call" onerror="this.style.display='none'">
        <div class="splash-title">RAPTOR'S CALL</div>
        <div class="splash-sub">Tactical Defense Network</div>
        <div class="splash-loader"><span></span><span></span><span></span></div>
    </div>

    <!-- MAP -->
    <div id="map-container">
        <canvas id="sim-canvas"></canvas>

        <!-- Rewind Sticker -->
        <div id="rewind-sticker">
            ⏪ REWIND <span class="time" id="rewind-time">2026-08-24 14:32:15</span>
        </div>

        <!-- Status -->
        <div id="status-overlay">
            <span class="dot"></span> <span id="status-text">Online</span>
            <span id="node-count">📡 4 Nodes</span>
            <span id="scenario-label">📍 MO</span>
        </div>

        <!-- Scenario Selector -->
        <div id="scenario-bar">
            <button data-scenario="mo" class="active">📍 MO</button>
            <button data-scenario="ms">📍 MS</button>
            <button data-scenario="md">📍 MD</button>
        </div>

        <!-- Alarm Indicator -->
        <div id="alarm-indicator">
            <span class="pulse-dot"></span>
            <span id="alarm-label">ALARM</span>
        </div>

        <!-- Toast -->
        <div id="alert-toast">
            <span id="toast-message">🚨 THREAT DETECTED</span>
            <div class="pin-prompt" id="pin-prompt" style="display:none;">
                <input type="password" id="pin-input" maxlength="4" placeholder="PIN" inputmode="numeric">
                <button id="pin-submit">✓</button>
            </div>
        </div>

        <!-- Chat -->
        <div id="chat-box">
            <div id="chat-messages">
                <div class="msg"><span class="sender">🦅 System</span><span class="text">Tactical Simulator ready.</span><span class="time">now</span></div>
            </div>
            <input id="chat-input" type="text" placeholder="Type a message...">
        </div>
    </div>

    <!-- CONTROLS -->
    <div id="controls">
        <!-- Row 1: Overlays -->
        <div class="ctrl-row">
            <button class="ctrl-btn overlay-btn" id="btnMesh">📡 Mesh</button>
            <button class="ctrl-btn overlay-btn" id="btnRadarToggle">📡 Radar</button>
            <button class="ctrl-btn overlay-btn" id="btnChatToggle">💬 Chat</button>
            <button class="ctrl-btn primary" id="btnRewind">🔄 Rewind</button>
        </div>
        <!-- Row 2: Speed + Alarms -->
        <div class="ctrl-row">
            <div class="speed-group">
                <span class="label">Speed</span>
                <button data-speed="0.5">0.5x</button>
                <button data-speed="1" class="active">1x</button>
                <button data-speed="2">2x</button>
                <button data-speed="5">5x</button>
            </div>
            <button class="ctrl-btn silent" id="btnSilent">🔇 Silent</button>
            <button class="ctrl-btn danger" id="btnLoud">🔊 Alarm</button>
            <button class="ctrl-btn danger" id="btnStopAlarm">⏹ Stop</button>
        </div>
    </div>
</div>

<script>
    // ========================================================================
    //  RAPTOR'S CALL — TACTICAL SIMULATOR V3
    //  Features: Canvas Map, Waypoint Pathing, 3 Scenarios, Rewind Sticker,
    //  Speed Control, Heading Triangle, Hardware Nudges.
    // ========================================================================

    // --- DOM REFS ---
    const canvas = document.getElementById('sim-canvas');
    const ctx = canvas.getContext('2d');
    const chatMessages = document.getElementById('chat-messages');
    const chatInput = document.getElementById('chat-input');
    const alertToast = document.getElementById('alert-toast');
    const toastMessage = document.getElementById('toast-message');
    const pinPrompt = document.getElementById('pin-prompt');
    const pinInput = document.getElementById('pin-input');
    const pinSubmit = document.getElementById('pin-submit');
    const alarmIndicator = document.getElementById('alarm-indicator');
    const alarmLabel = document.getElementById('alarm-label');
    const rewindSticker = document.getElementById('rewind-sticker');
    const rewindTime = document.getElementById('rewind-time');
    const statusText = document.getElementById('status-text');
    const nodeCountDisplay = document.getElementById('node-count');
    const scenarioLabel = document.getElementById('scenario-label');
    const splashScreen = document.getElementById('splash-screen');

    // --- STATE ---
    let nodes = [];
    let nodeHistory = {};
    let isRewinding = false;
    let radarActive = false;
    let radarAngle = 0;
    let chatOpen = false;
    let alarmActive = false;
    let alarmType = '';
    let speedMultiplier = 1.0;
    let showMesh = true; // default on
    let showRadarOverlay = false;
    let showChatOverlay = false;
    let alertTimer = null;
    let audioCtx = null;
    let sirenInterval = null;
    let isAlarmSounding = false;
    let currentScenario = 'mo';
    let simTime = Date.now();
    let rewindActive = false;
    let frameCount = 0;

    // --- SCENARIO DEFINITIONS (Waypoints for real locations) ---
    // Coordinates are in percentage of canvas (0-100).
    // MO: Danye Jones (St. Louis County, suburban)
    // MS: Tasia Fortune (Jackson, grid street)
    // MD: Catherine Lee (Annapolis, wooded suburban)
    const SCENARIOS = {
        mo: {
            label: '📍 MO (Danye Jones)',
            mapStyle: 'suburban',
            victimPath: [{x: 15, y: 75}, {x: 25, y: 65}, {x: 35, y: 55}, {x: 45, y: 50}, {x: 55, y: 45}],
            threatPath: [{x: 80, y: 20}, {x: 70, y: 30}, {x: 60, y: 40}, {x: 50, y: 45}, {x: 55, y: 45}],
            protectors: [[70, 80], [20, 20], [85, 70]],
            treePos: {x: 55, y: 45}
        },
        ms: {
            label: '📍 MS (Tasia Fortune)',
            mapStyle: 'grid',
            victimPath: [{x: 20, y: 80}, {x: 30, y: 70}, {x: 40, y: 60}, {x: 50, y: 50}, {x: 60, y: 40}],
            threatPath: [{x: 85, y: 15}, {x: 75, y: 25}, {x: 65, y: 35}, {x: 55, y: 40}, {x: 60, y: 40}],
            protectors: [[80, 80], [15, 15], [85, 85]],
            treePos: {x: 60, y: 40}
        },
        md: {
            label: '📍 MD (Catherine Lee)',
            mapStyle: 'wooded',
            victimPath: [{x: 10, y: 85}, {x: 20, y: 75}, {x: 30, y: 65}, {x: 40, y: 55}, {x: 50, y: 50}],
            threatPath: [{x: 90, y: 10}, {x: 80, y: 20}, {x: 70, y: 30}, {x: 60, y: 40}, {x: 50, y: 50}],
            protectors: [[75, 85], [10, 15], [90, 75]],
            treePos: {x: 50, y: 50}
        }
    };

    // --- HELPERS ---
    function rand(min, max) { return Math.random() * (max - min) + min; }

    // --- NODE FACTORY ---
    function createNode(id, name, type, status, path, color) {
        const start = path[0] || {x: rand(10,90), y: rand(10,90)};
        return {
            id, name, type, status,
            x: start.x, y: start.y,
            path: path.slice(1), // remaining waypoints
            pathIndex: 0,
            targetX: path[1] ? path[1].x : start.x,
            targetY: path[1] ? path[1].y : start.y,
            color: color,
            history: [],
            heading: rand(0, 360),
            size: type === 'personal' ? 12 : 8,
        };
    }

    function initScenario(scenarioKey) {
        const scenario = SCENARIOS[scenarioKey];
        if (!scenario) return;

        // Reset nodes
        const newNodes = [];
        const vPath = scenario.victimPath;
        const tPath = scenario.threatPath;

        // 1. You (Victim) - Green
        const you = createNode('you', 'You', 'personal', 'friendly', vPath, '#00d26a');
        you.heading = 90;
        newNodes.push(you);

        // 2. Threat - Red
        const threat = createNode('threat', 'Unknown', 'threat', 'threat', tPath, '#ff3b4a');
        newNodes.push(threat);

        // 3. Protectors (Green friends) coming from sides
        scenario.protectors.forEach((pos, i) => {
            const p = createNode(`protector-${i}`, `Team-${String.fromCharCode(65+i)}`, 'mesh', 'friendly', 
                [{x: pos[0], y: pos[1]}, {x: pos[0]-5, y: pos[1]-5}], '#00d26a');
            p.x = pos[0];
            p.y = pos[1];
            p.targetX = pos[0];
            p.targetY = pos[1];
            p.path = [];
            newNodes.push(p);
        });

        nodes = newNodes;
        nodeHistory = {};
        nodes.forEach(n => { nodeHistory[n.id] = []; });

        // Update UI
        scenarioLabel.textContent = scenario.label;
        document.querySelectorAll('#scenario-bar button').forEach(b => {
            b.classList.toggle('active', b.dataset.scenario === scenarioKey);
        });
        addChatMessage('🔄 Scenario', `Loaded ${scenario.label}`, 'System');
        addChatMessage('📍 Route', 'Victim walking toward the tree. Threat approaching.', 'System');
    }

    // --- UPDATE NODES (Waypoint Pathing) ---
    function updateNodes() {
        const speed = speedMultiplier * 0.6; // base speed
        const now = Date.now();

        nodes.forEach(node => {
            // If node has a path, follow it
            if (node.path && node.path.length > 0) {
                const target = node.path[node.pathIndex] || node.path[node.path.length - 1];
                const dx = target.x - node.x;
                const dy = target.y - node.y;
                const dist = Math.sqrt(dx*dx + dy*dy);

                if (dist < 0.8) {
                    // Move to next waypoint
                    if (node.pathIndex < node.path.length - 1) {
                        node.pathIndex++;
                        const nextTarget = node.path[node.pathIndex];
                        // Update heading based on direction
                        const hdx = nextTarget.x - node.x;
                        const hdy = nextTarget.y - node.y;
                        if (Math.abs(hdx) > 0.1 || Math.abs(hdy) > 0.1) {
                            node.heading = Math.atan2(hdy, hdx) * (180 / Math.PI);
                        }
                    }
                } else {
                    // Move toward target
                    const moveX = (dx / dist) * speed * 0.5;
                    const moveY = (dy / dist) * speed * 0.5;
                    node.x += moveX;
                    node.y += moveY;
                    // Update heading smoothly
                    if (Math.abs(dx) > 0.1 || Math.abs(dy) > 0.1) {
                        node.heading = Math.atan2(dy, dx) * (180 / Math.PI);
                    }
                }
            }

            // Clamp
            node.x = Math.max(1, Math.min(99, node.x));
            node.y = Math.max(1, Math.min(99, node.y));

            // Store history (for rewind)
            nodeHistory[node.id].push({ x: node.x, y: node.y, time: now });
            if (nodeHistory[node.id].length > 80) nodeHistory[node.id].shift();

            // Threat logic: if alarm not active, stalk. If alarm active, flee or stand still.
            if (node.status === 'threat' && !alarmActive) {
                // Threat moves toward the "You" node if not on path
                // But since we have waypoints, we let waypoints handle it.
                // Just ensure it follows its path.
            }
        });

        // Radar sweep
        radarAngle += 0.05 * speedMultiplier;
        if (radarAngle > 360) radarAngle = 0;

        // Update node count
        nodeCountDisplay.textContent = '📡 ' + nodes.length + ' Nodes';
    }

    // --- DRAW MAP (Static suburban tactical map) ---
    function drawMap(scale = 1.0) {
        const w = canvas.width;
        const h = canvas.height;
        const scenario = SCENARIOS[currentScenario];

        // Background
        ctx.fillStyle = '#0a0e1c';
        ctx.fillRect(0, 0, w, h);

        // Draw grid / roads depending on scenario
        const isGrid = scenario.mapStyle === 'grid';
        const isWooded = scenario.mapStyle === 'wooded';

        // Draw roads (dark gray)
        ctx.strokeStyle = '#1a1f2e';
        ctx.lineWidth = 3;

        if (isGrid) {
            // Grid streets
            for (let i = 0; i <= 10; i++) {
                const pos = (i / 10) * w;
                ctx.beginPath();
                ctx.moveTo(pos, 0);
                ctx.lineTo(pos, h);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, pos);
                ctx.lineTo(w, pos);
                ctx.stroke();
            }
        } else if (isWooded) {
            // Winding paths
            ctx.beginPath();
            ctx.moveTo(0, h * 0.8);
            ctx.quadraticCurveTo(w * 0.3, h * 0.6, w * 0.5, h * 0.5);
            ctx.quadraticCurveTo(w * 0.7, h * 0.4, w, h * 0.2);
            ctx.stroke();
            // Side path
            ctx.beginPath();
            ctx.moveTo(w * 0.4, h);
            ctx.quadraticCurveTo(w * 0.5, h * 0.7, w * 0.5, h * 0.5);
            ctx.stroke();
        } else {
            // Suburban (MO) - rectangle blocks with roads
            ctx.strokeStyle = '#1a1f2e';
            ctx.lineWidth = 2.5;
            // Main horizontal road
            ctx.beginPath();
            ctx.moveTo(0, h * 0.5);
            ctx.lineTo(w, h * 0.5);
            ctx.stroke();
            // Vertical road
            ctx.beginPath();
            ctx.moveTo(w * 0.5, 0);
            ctx.lineTo(w * 0.5, h);
            ctx.stroke();
            // Side streets
            ctx.beginPath();
            ctx.moveTo(0, h * 0.25);
            ctx.lineTo(w * 0.5, h * 0.25);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(w * 0.5, h * 0.75);
            ctx.lineTo(w, h * 0.75);
            ctx.stroke();
            // Block fill (lawns)
            ctx.fillStyle = '#0d1f12';
            ctx.fillRect(5, 5, w*0.48-10, h*0.23-10);
            ctx.fillRect(w*0.52+5, 5, w*0.48-10, h*0.23-10);
            ctx.fillRect(5, h*0.27+5, w*0.48-10, h*0.21-10);
            ctx.fillRect(w*0.52+5, h*0.27+5, w*0.48-10, h*0.21-10);
            ctx.fillRect(5, h*0.52+5, w*0.48-10, h*0.21-10);
            ctx.fillRect(w*0.52+5, h*0.52+5, w*0.48-10, h*0.21-10);
            // Houses (small brown rectangles)
            ctx.fillStyle = '#2a1f14';
            const housePositions = [
                [15, 15], [30, 15], [70, 15], [85, 15],
                [15, 35], [30, 35], [70, 35], [85, 35],
                [15, 60], [30, 60], [70, 60], [85, 60],
                [15, 80], [30, 80], [70, 80], [85, 80]
            ];
            housePositions.forEach(([px, py]) => {
                const x = (px / 100) * w;
                const y = (py / 100) * h;
                ctx.fillRect(x - 6, y - 4, 12, 8);
                ctx.fillStyle = '#3a2f24';
                ctx.fillRect(x - 2, y - 6, 4, 3);
                ctx.fillStyle = '#2a1f14';
            });
        }

        // Draw the "Hanging Tree" (Red marker with trunk)
        const tree = scenario.treePos;
        const tx = (tree.x / 100) * w;
        const ty = (tree.y / 100) * h;

        // Trunk
        ctx.fillStyle = '#3a2a1a';
        ctx.fillRect(tx - 2, ty, 4, 12);

        // Canopy (red circle for danger)
        ctx.shadowColor = '#ff3b4a';
        ctx.shadowBlur = 30;
        ctx.beginPath();
        ctx.arc(tx, ty - 4, 16, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 59, 74, 0.25)';
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.arc(tx, ty - 4, 12, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 59, 74, 0.5)';
        ctx.fill();
        ctx.font = '10px sans-serif';
        ctx.fillStyle = '#ff6a76';
        ctx.textAlign = 'center';
        ctx.fillText('⚠️ TREE', tx, ty - 22);

        // Draw street labels
        ctx.font = '7px monospace';
        ctx.fillStyle = 'rgba(255,255,255,0.1)';
        ctx.textAlign = 'left';
        if (isGrid) {
            ctx.fillText('JACKSON AVE', 10, 12);
            ctx.fillText('STATE ST', w*0.52+10, h*0.52-5);
        } else if (!isWooded) {
            ctx.fillText('PARK RIDGE RD', 10, h*0.52 - 5);
            ctx.fillText('ELM ST', w*0.52 + 10, 20);
        }
    }

    // --- DRAW NODES ---
    function drawNodes() {
        const w = canvas.width;
        const h = canvas.height;

        // If Rewind is active, draw trails FIRST (so they are behind nodes)
        if (isRewinding) {
            const now = Date.now();
            nodes.forEach(node => {
                if (node.status === 'threat' || node.status === 'unknown') {
                    const history = nodeHistory[node.id] || [];
                    history.forEach((pos, idx) => {
                        const alpha = 0.1 + (idx / history.length) * 0.6;
                        const size = 2 + (idx / history.length) * 5;
                        const x = (pos.x / 100) * w;
                        const y = (pos.y / 100) * h;
                        ctx.beginPath();
                        ctx.arc(x, y, size, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(255, 59, 74, ${alpha * 0.6})`;
                        ctx.fill();
                    });
                }
            });
        } else {
            // Normal: show recent trail for threats only
            nodes.forEach(node => {
                if (node.status === 'threat') {
                    const history = nodeHistory[node.id] || [];
                    const recent = history.slice(-30);
                    recent.forEach((pos, idx) => {
                        const alpha = 0.05 + (idx / recent.length) * 0.2;
                        const x = (pos.x / 100) * w;
                        const y = (pos.y / 100) * h;
                        ctx.beginPath();
                        ctx.arc(x, y, 3, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(255, 59, 74, ${alpha})`;
                        ctx.fill();
                    });
                }
            });
        }

        // Draw nodes
        nodes.forEach(node => {
            // Skip if mesh is off and node is not personal
            if (!showMesh && node.type !== 'personal' && node.status !== 'threat') return;

            const x = (node.x / 100) * w;
            const y = (node.y / 100) * h;
            const size = node.size || 8;

            // Glow
            const color = node.status === 'threat' ? '#ff3b4a' : (node.status === 'unknown' ? '#f0b429' : '#00d26a');
            const shadow = ctx.shadowColor;
            const blur = ctx.shadowBlur;
            ctx.shadowColor = color;
            ctx.shadowBlur = 20;

            // Dot
            ctx.beginPath();
            ctx.arc(x, y, size, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();
            ctx.shadowBlur = 0;

            // Border
            ctx.strokeStyle = 'rgba(255,255,255,0.4)';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // Label
            ctx.font = '7px monospace';
            ctx.fillStyle = 'rgba(255,255,255,0.5)';
            ctx.textAlign = 'center';
            ctx.fillText(node.name, x, y - size - 6);

            // Heading Triangle (for "You")
            if (node.type === 'personal') {
                const angle = (node.heading || 0) * (Math.PI / 180);
                const triSize = 10;
                ctx.beginPath();
                ctx.moveTo(x + Math.cos(angle) * triSize, y + Math.sin(angle) * triSize);
                ctx.lineTo(x + Math.cos(angle + 2.5) * triSize * 0.5, y + Math.sin(angle + 2.5) * triSize * 0.5);
                ctx.lineTo(x + Math.cos(angle - 2.5) * triSize * 0.5, y + Math.sin(angle - 2.5) * triSize * 0.5);
                ctx.closePath();
                ctx.fillStyle = '#f0b429';
                ctx.fill();
                ctx.strokeStyle = 'rgba(255,255,255,0.3)';
                ctx.lineWidth = 1;
                ctx.stroke();
            }
        });
    }

    // --- DRAW RADAR ---
    function drawRadar() {
        if (!showRadarOverlay || !radarActive) return;
        const w = canvas.width;
        const h = canvas.height;
        const cx = w/2, cy = h/2;
        const radius = Math.min(w, h) * 0.32;

        // Semi-transparent radar rings
        ctx.strokeStyle = 'rgba(34, 211, 238, 0.08)';
        ctx.lineWidth = 0.5;
        for (let r = 0.2; r <= 1; r += 0.2) {
            ctx.beginPath();
            ctx.arc(cx, cy, radius * r, 0, Math.PI * 2);
            ctx.stroke();
        }

        // Sweep
        const sweepAngle = (radarAngle * Math.PI) / 180;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, radius, sweepAngle - 0.4, sweepAngle + 0.1);
        ctx.closePath();
        ctx.fillStyle = 'rgba(34, 211, 238, 0.05)';
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + Math.cos(sweepAngle) * radius, cy + Math.sin(sweepAngle) * radius);
        ctx.strokeStyle = 'rgba(34, 211, 238, 0.3)';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // Blips
        nodes.forEach(node => {
            const dx = node.x - 50;
            const dy = node.y - 50;
            const dist = Math.sqrt(dx*dx + dy*dy) / 50;
            if (dist > 1) return;
            const angle = Math.atan2(dy, dx);
            const bx = cx + Math.cos(angle) * dist * radius;
            const by = cy + Math.sin(angle) * dist * radius;
            ctx.beginPath();
            ctx.arc(bx, by, 3 + Math.random()*2, 0, Math.PI*2);
            const col = node.status === 'threat' ? 'rgba(255,59,74,0.7)' : 'rgba(34,211,238,0.6)';
            ctx.fillStyle = col;
            ctx.shadowColor = col;
            ctx.shadowBlur = 15;
            ctx.fill();
            ctx.shadowBlur = 0;
        });
    }

    // --- REWIND STICKER UPDATE ---
    function updateRewindSticker() {
        if (isRewinding) {
            rewindSticker.style.display = 'block';

    // --- MAIN RENDER LOOP ---
    function render() {
        const container = canvas.parentElement;
        const w = container.clientWidth || 400;
        const h = container.clientHeight || 600;
        canvas.width = w;
        canvas.height = h;

        // 1. Draw Map
        drawMap();

        // 2. Draw Nodes (with trails)
        drawNodes();

        // 3. Draw Radar overlay
        drawRadar();

        // 4. Update sticker
        updateRewindSticker();

        // 5. Frame counter
        frameCount++;
    }

    // --- GAME LOOP ---
    function gameLoop() {
        updateNodes();
        render();
        requestAnimationFrame(gameLoop);
    }

    // --- ALARM / AUDIO ---
    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
    }

    function playSiren() {
        if (isAlarmSounding) return;
        initAudio();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        // Try loading a wave file first
        const audioEl = new Audio('/siren.wav');
        audioEl.volume = 1.0;
        audioEl.play().then(() => {
            isAlarmSounding = true;
            // Loop it
            audioEl.loop = true;
            sirenInterval = setInterval(() => {
                if (!isAlarmSounding) {
                    audioEl.pause();
                    audioEl.currentTime = 0;
                    clearInterval(sirenInterval);
                }
            }, 1000);
        }).catch(() => {
            // Fallback: Web Audio Synth
            isAlarmSounding = true;
            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0.6, audioCtx.currentTime);
            gain.connect(audioCtx.destination);

            let freq = 400;
            let dir = 1;
            const osc = audioCtx.createOscillator();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.connect(gain);
            osc.start();

            sirenInterval = setInterval(() => {
                if (!isAlarmSounding) { 
                    clearInterval(sirenInterval); 
                    try { osc.stop(); } catch(e) {}
                    return; 
                }
                freq += dir * 25;
                if (freq > 850) dir = -1;
                if (freq < 350) dir = 1;
                try { osc.frequency.setValueAtTime(freq, audioCtx.currentTime); } catch(e) {}
            }, 70);
        });
    }

    function stopSiren() {
        isAlarmSounding = false;
        if (sirenInterval) { clearInterval(sirenInterval); sirenInterval = null; }
        // Stop all audio elements
        document.querySelectorAll('audio').forEach(a => { a.pause(); a.currentTime = 0; });
    }

    // --- TRIGGER ALARM ---
    function triggerAlarm(type) {
        if (alarmActive && type === alarmType) return;
        initAudio();

        const msg = type === 'loud' ? 
            '🔊 LOUD ALARM — Siren activated! (Hardware: Personal Alarm Loadout 1)' :
            '🔇 SILENT ALARM — Team notified discreetly. (Hardware: Mesh Nodes Loadout 3)';
        showToast(msg, type === 'silent', false);

        alarmActive = true;
        alarmType = type;
        document.getElementById('btnStopAlarm').classList.add('visible');
        alarmIndicator.style.display = 'flex';
        if (type === 'silent') {
            alarmIndicator.className = 'silent-mode';
            alarmLabel.textContent = 'SILENT';
        } else {
            alarmIndicator.className = '';
            alarmLabel.textContent = 'LOUD';
        }

        if (type === 'loud') playSiren();

        // Move protectors toward the tree
        const scenario = SCENARIOS[currentScenario];
        const tree = scenario.treePos;
        nodes.forEach(node => {
            if (node.status === 'friendly' && node.type !== 'personal') {
                node.path = [{x: tree.x + rand(-5,5), y: tree.y + rand(-5,5)}];
                node.pathIndex = 0;
                node.targetX = tree.x;
                node.targetY = tree.y;
            }
        });

        addChatMessage('🆘 ' + (type === 'loud' ? '🔊' : '🔇'), 
            type === 'loud' ? 'EMERGENCY! Converging on location.' : 'I need backup. Discreet tracking.', 'You');

        setTimeout(() => {
            addChatMessage('✅ Team', 'Responding. ETA 60 seconds.', 'System');
        }, 1000);
        setTimeout(() => {
            addChatMessage('💡 Raptor', 'Hardware: ' + (type === 'loud' ? 'Personal Alarm (L1)' : 'Mesh Nodes (L3)'), 'System');
        }, 2500);
    }

        if (chatOpen && !chatBox.contains(e.target) && e.target.id !== 'btnChatToggle') {
            chatBox.classList.remove('active');
            chatOpen = false;
            document.getElementById('btnChatToggle').classList.remove('chat-active');
            document.getElementById('btnChatToggle').textContent = '💬 Chat';
        }
    });

    // --- START ---
    function randInt(min, max) { return Math.floor(rand(min, max + 1)); }

    // Splash screen
    setTimeout(() => {
        splashScreen.classList.add('hidden');
        setTimeout(() => { splashScreen.style.display = 'none'; }, 800);
    }, 2200);

    // Init default scenario
    initScenario('mo');

    // Welcome messages
    setTimeout(() => {
        addChatMessage('🦅 Raptor', '🆓 Tactical Simulator loaded.', 'System');
        addChatMessage('💡 Tip', 'Select MO, MS, or MD for real crime scenes.', 'System');
        addChatMessage('💡 Tip', 'Press ALARM to see protectors swarm in.', 'System');
        addChatMessage('💡 Tip', 'PIN 1111 to stop alarms. Use Rewind for trails.', 'System');
    }, 2500);

    // Resize handler
    window.addEventListener('resize', () => { render(); });

    // Start the loop
    gameLoop();

    console.log('🦅 Raptor\'s Call Tactical Simulator V3 loaded.');
    console.log('📍 Scenarios: MO (Danye), MS (Tasia), MD (Catherine)');
    console.log('🔊 Place siren.wav in /public for custom sound.');
</script>
